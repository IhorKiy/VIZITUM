services:
  postgres:
    image: postgres:16-alpine
    container_name: vizitum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vizitum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vizitum_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vizitum"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vizitum-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vizitum_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vizitum_postgres_data:
  vizitum_redis_data:
